<!-- 
브라우저에 데이터를 저장하는 저장소
WebStorage
데이터가 저장되는 유효기간(scope)에 따라서 달라진다.
1. LocalStorage
   동일한 디바이스, 동일한 디바이스라면 만료기한이 따로 없다.
   웹페이지가 닫혀지는 것과도 당연히 무관하다. 
   단, 객체저장이 안되고 오직 문자열로만 저장이 된다.
   객체(JSON)를 저장하려면??? 
   1) JSON 데이터를 직렬화시킨다.(serialization) - JSON.stringify(info)
   2) JSON 데이터를 역직렬화시킨다.(deserialization)
      원래 객체 덩어리로 다시 원상복귀...원본 데이터를 그대로 얻는다 = JSON.parse
   
   API
   ---------
   저장: localStorage.setItem("key", "value")
   삭제: localStorage.removeItem("key")
   모두삭제: localStorage.clear()
   조회: localStorage.getItem("key")
   데이터 갯수: localStorage.length()
   
   
2. SessionStorage
   웹페이지가 닫혀지면 데이터도 없어진다.

 -->

<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<style type="text/css">
	
	</style>
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script type="text/javascript">
	function saveBtn() {
		localStorage.setItem("key1", "안녕");
		localStorage.setItem("key2", "Hello");
		localStorage.setItem("key3", "Bongjur");
	}
	
	function delBtn() {
		localStorage.removeItem("key2");
	}
		
	function delAllBtn() {
		localStorage.clear();
	}
	
	function showBtn() {
		console.log(localStorage.getItem("key1") + ", " + 
				localStorage.getItem("key2") + ", " + 
				localStorage.getItem("key3"));
		
		localStorage.getItem("key1") + ", " + 
		localStorage.getItem("key2") + ", " + 
		localStorage.getItem("key3");
	}
	</script>
</head>
<body>
	<button id="saveBtn" onclick="saveBtn()")>저장</button>
	<button id="delBtn" onclick="delBtn()")>삭제</button>
	<button id="delAllBtn" onclick="delAllBtn()")>모두 삭제</button>
	<button id="showBtn" onclick="showBtn()")>조회</button>
</body>
</html>
