<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>forEach 사용법</title>
	<script type="text/javascript">
		function choiceMenu() {
			let menus = document.frm.menu; // 배열...
			let str = "";
			
			menus.forEach(menu => {
				if (menu.checked) 
					str += menu.value + " ";
				menu.checked = false;
			});
			
			if (str !== "") 
				alert(str);
			else
				alert("Choose One");
		}			
	</script>
</head>
<body>
	<h2>CheckBox Form</h2>
	<form action="#" name="frm">
		<h3>내일 점심 메뉴를 모두 선택하세요.</h3>
		<input type="checkbox" name="menu" value="김치찌개" />김치찌개<br />
		<input type="checkbox" name="menu" value="돈가쓰" />왕돈가쓰<br />
		<input type="checkbox" name="menu" value="카레라이스" />인도카레<br />
		<input type="checkbox" name="menu" value="비빔밥" />비빔밥<br />
		<input type="button" value="메뉴선택" onclick="choiceMenu()" />
	</form>
</body>
</html>
