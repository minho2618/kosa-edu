<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2. onclick 속성을 사용하지 않는 방법</title>
</head>
<body>
	<h1>Javascirpt란?</h1>
	<p id="content">JavaScript is the world's most popular programming language.</p>
	<button>CLICK</button>
</body>
<script>
// 1. button을 클릭하면 자바스크립트 함수로 바로 연결
document.querySelector("button").onclick = push;

function push() {
	const content = document.querySelector("#content");
	content.innerHTML = "<h3 style='color: crimson'>Hello Javascript~</h3>";
}
</script>
</html>
