<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script type="text/javascript">
		$(() => {
			 //input 태그...속성 이름이 type 속성값이 text
			 $('[type=text]').val('함동윤').css('color', 'blue');
			 
			 alert($('[name=한국]').val());
			 
			 $('input[name*=한국]').css('background-color', 'yellow');
		});
	</script>
</head>
<body>
<h3> 폼 속성 선택자 사용법</h3>
<input type="text">
<input name="한국" value="한국사람">
<input name="한국인" value="KO한국인">
<input name="한국 민" value="한국 민">
<input name="대 한국 민" value="대 한국 민">
</body>
</html>
