<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>동적으로 폼 생성하기</title>
	
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<style type="text/css">
	
	</style>
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script type="text/javascript">
	$(() => {
		$('#addOptionBtn').one("click", function() {
			let arr = ["우승환", "강민기", "함동윤", "김선호", "장연정"];
			
			
			// 2. arr의 각 요소를 <option value="ㅁㅁㅁ">ㅁㅁㅁ</option>
			$.each(arr, (index, item) => {
				let option = `<option value=${item}>${item}</option>`;
				$('#friends').append(option);
			});
			
			// $(this).unbind(); // deprecated, unbind 시키는 것
			// $(this).off();
		});
		
		// 3.
		$('#delOptionBtn').one("click", function() {
			$('#friends > option').remove();
		});
	});
	</script>
</head>
<body>
	<h2>동적으로 폼 생성하기</h2>
	<input type="button" value="옵션 생성" id="addOptionBtn" />
	<input type="button" value="옵션 삭제" id="delOptionBtn" />
	<select id="friends">
		
	</select>
</body>
</html>
