<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>confirm (확인 | 취소) | alert | prompt</title>
	
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<style type="text/css">
	
	</style>
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script type="text/javascript">
	$(() => {
		// 1. a태그 속성 href값 중에 school이라는 단어가 포함된 사이트를 클릭하면...
		/* $('a[href*=school]').on('click', function() {
			return confirm(`사이트로 이동하시겠습니까?`);
		}); */		

		$('a').on('click', function() {
			// return confirm(`${$(this).text()} 사이트로 이동하시겠습니까?`); 
			// return confirm(`${this.text()} 사이트로 이동하시겠습니까?`); // 안됨
			/* this는 자바스크립트의 표현, .text()는 JQuery의 문법 */
			return confirm(`${this.innerText} 사이트로 이동하시겠습니까?`); // 동작함
		});
	});
	</script>
</head>
<body>
	<h2><a href="https://jquery.com/">JQuery</a></h2>
	<h2><a href="https://www.w3schools.com/">W3School</a></h2>
</body>
</html>
