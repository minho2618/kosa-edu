<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>confirm (확인 | 취소) | alert | prompt</title>
	
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<style type="text/css">
	
	</style>
	
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script type="text/javascript">
	$(() => {
		// 1. 버튼 클릭하면 함수 호출...
		$('#createBtn').on('click', function() {
			// 2. 버튼의 타이틀을 받아와서 div영역에 출력
			// $('#resultView').html($(this).val());
			// $('#resultView').append($(this).val());
			
			// 3. html() 사용...그런데 append()썼을때와 동일하게 출력되도록 작성
			// let result = $('#resultView').html();
			// $('#resultView').html(result + $(this).val() + "<p>");
			
			/* $('#createSel').on('change', function() {
				console.log('select');
				$('#resultView').html(result + $(this).val() + "<p>");
			});	 */
		});
		
		$('#createSel').on("change", function() {
			//console.log($(this).val());
			$('#resultView').html($('#resultView').html() + $(this).val() + "<p>");
		});	
	});
	</script>
</head>
<body>
	<input type="button" value="버튼 클릭시 동적으로 문자열 생성" id="createBtn" />
	<select id="createSel">
		<option>SK텔레콤 서비스 대학로점</option>
		<option>SK텔레콤 서비스 구로역점</option>
		<option>SK텔레콤 서비스 삼성대로점</option>
		<option>SK텔레콤 서비스 신림점</option>
		<option>SK텔레콤 서비스 종로3가점</option>
	</select>
	<div id="resultView">
		
	</div>
</body>
</html>
