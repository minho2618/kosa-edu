<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<style>
		.chart-container {
			width: 600px;
			height: 600px;
			margin: 0 auto;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1 class="jumbotron text-center">A항공사 년도별 승객수 누적현황 차트 통계</h1>
		<div class="chart-container">
			<canvas id="passenger-chart"></canvas>
		</div>
	</div>
</body>
<script>
	const ctx = document.querySelector('#passenger-chart');
	const month = ['1월 승객수', '2월 승객수', '3월 승객수', '4월 승객수', '5월 승객수', '6월 승객수',
		'7월 승객수', '8월 승객수', '9월 승객수', '10월 승객수', '11월 승객수', '12월 승객수',];
	
	let dataPassenger2022 = {
			label: '2022년',
			data: [100, 80, 90, 120, 130, 140, 150, 70, 100, 50, 70, 80],
			backgroundColor:'rgba(203,206,145,.5)',
			borderColor:'crimson',
			borderWidth: 2,
	};
	let dataPassenger2023 ={
			label: '2023년',
			data: [100, 50, 70, 80, 80, 90, 150, 70, 120, 130, 140, 100],
			backgroundColor:'rgba(203,206,145,.5)',
			borderColor:'SlateBlue',
			borderWidth: 2,
	};
	
	let config = {
		type: 'bar',
		data: {
			labels: month,
			datasets: [dataPassenger2022, dataPassenger2023]
		},
		options: {
			maintainAspectRatio: false,
			scales: {
				x: {
					ticks: {
						display: true,
						maxRotation: 45,
						minRotation: 45,
						autoSkip: false,
					}
				},
			},			
		},
	}
	
	new Chart(ctx, config);
</script>
</html>
