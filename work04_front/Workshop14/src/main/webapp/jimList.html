<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>KOSA DVD</title>
	<link rel="stylesheet" type="text/css" href="css/basic.css"/>
	<style type="text/css">
		.poster {
			width: 150px;
			height: 150px;
		}
	</style>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script>
	$(function() {
		refreshPage();
		
		$('#content').on('click',"#delBtn", deleteCartStorage);
	});
	
	function refreshPage() {
		let html = '';
		let totalPrice = 0;
		
		// 1. localStorage에 저장된 내용을 가져온다...getItem()
		for (let key in localStorage) {
			if (key === "length")
				break;
			
			let data = localStorage.getItem(key).split(",");
			
			html += `<tr>
						<td><img class="poster" src="${data[1]}" /></td> 
						<td id="movie_key">${key}</td>
						<td id="movie_name">${data[0]}</td>
						<td id="movie_price">${data[2]}</td>
						<td><button id="delBtn" value="${key}">삭제</button></td>
					</tr>`;
					
			totalPrice += parseInt(data[2]);
		}		
		
		$('#content').html(html);
		$('#price').html(`총 주문 가격: ${totalPrice}원`);
	}
	
	function deleteCartStorage() { 
		let y = confirm("찜목록에서 삭제하시겠습니까?");
		
		if (y) {
			localStorage.removeItem($(this).val());
			//window.location.reload();
			refreshPage();
		}
	}
	</script>
</head>
<body>
<article class="main">
		<section>
			<table width="80%"  align="center"  >
			<caption class="caption">찜 리스트</caption>
			<thead>
				<tr><th>이미지</th><th>상품번호</th><th>상품이름</th><th>가격</th><th>삭제</th></tr>
			</thead>
			<tbody id="content">
			</tbody>
			</table>
		</section>
		<section  class="toalprice" id="price">
			
		</section>
		<section class="link">
			<table   align="center">
			<tr><td align="center">
				<a href="">주문하러 가기</a> 
				<a href="index.html">DVD 목록</a> 
			</td></tr>
			</table>
		</section>
		</article>
</body>
</html>
